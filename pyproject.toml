[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewaste"
version = "0.1.0"
description = "Edge-deployed waste classification with sensor-augmented vision and federated learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Public-dataset download (Stage 1 data merge) and future stages.
data = ["kaggle>=1.6"]
# Detection stage (YOLO26 item localization). See requirements.txt for the
# version-pinning caveat.
detect = ["ultralytics>=8.4"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
edgewaste-ingest = "edgewaste.data.ingest:main"
edgewaste-fetch = "edgewaste.data.kaggle_sources:main"
edgewaste-split = "edgewaste.data.splits:main"
edgewaste-train = "edgewaste.train:main"
edgewaste-eval = "edgewaste.evaluate:main"
edgewaste-infer = "edgewaste.infer:main"
edgewaste-detect-fetch = "edgewaste.detect.data:main"
edgewaste-detect-train = "edgewaste.detect.train:main"
edgewaste-pipeline = "edgewaste.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgewaste = ["py.typed"]
