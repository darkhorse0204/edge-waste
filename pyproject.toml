# pyproject.toml - python package definition, dependencies and edgewaste-* command-line entry points
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewaste"
version = "0.1.0"
description = "Edge-deployed waste classification with sensor-augmented vision and federated learning"
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Public-dataset download (Stage 1 data merge) and future stages.
data = ["kaggle>=1.6"]
# Detection stage (YOLO26 item localization). See requirements.txt for the
# version-pinning caveat.
detect = ["ultralytics>=8.4"]
# Stage 2/3: explainability, edge export. OCI and federated learning use
# only sklearn/numpy/torch, already core deps.
explain = ["grad-cam>=1.5"]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
# 2-day hardware prototype: serial link to the Arduino sensor and actuator node.
hardware = ["pyserial>=3.5"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
edgewaste-ingest = "edgewaste.data.ingest_raw_datasets:main"
edgewaste-fetch = "edgewaste.data.download_kaggle_datasets:main"
edgewaste-split = "edgewaste.data.make_data_splits:main"
edgewaste-train = "edgewaste.classification.train_classifier:main"
edgewaste-eval = "edgewaste.classification.evaluate_classifier:main"
edgewaste-infer = "edgewaste.classification.run_inference:main"
edgewaste-detect-fetch = "edgewaste.detection.prepare_taco_dataset:main"
edgewaste-detect-train = "edgewaste.detection.train_detector:main"
edgewaste-pipeline = "edgewaste.applications.live_camera_pipeline:main"
edgewaste-federated = "edgewaste.federated.fedavg_simulation:main"
edgewaste-export = "edgewaste.classification.export_onnx:main"
edgewaste-video = "edgewaste.applications.video_litter_survey:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgewaste = ["py.typed"]
